const $=id=>document.getElementById(id);let current='lock',unlocked=false,secret=false,currentPost=null,mediaIndex=0,liked=false,saved=false;
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function openView(name){if(name==='photos'||!$(name))return;if(!unlocked && !['lock','passcode'].includes(name)){showPasscode();return}document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===name));current=name;$('wall').style.display=['lock','passcode','home'].includes(name)?'':'none';$('shade').style.display=['lock','passcode','home'].includes(name)?'':'none';$('status').classList.toggle('dark',!['lock','passcode','home','kchat'].includes(name));}
function imgAvatar(src,txt,cls='avatar'){const a=el('span',cls);if(src){let img=el('img');img.src=src;img.alt='';img.onerror=()=>{img.remove();a.textContent=(txt||'').slice(0,2)};a.append(img)}else a.textContent=(txt||'').slice(0,2);return a}
function makeRow(parent,name,preview,time,photo,onclick){let b=el('button','listrow');b.type='button';b.append(imgAvatar(photo,name));let t=el('div','rowtext'),h=el('div','rowtitle');h.append(el('strong','',name),el('span','muted',time||''));t.append(h,el('div','preview',preview||''));b.append(t);if(onclick)b.addEventListener('click',onclick);parent.append(b)}
function renderLists(){let k=$('kakaoList');k.replaceChildren();STORY.kakaoRooms.forEach(r=>makeRow(k,r.name+(r.id==='k-monkey-group'?' (5)':''),r.messages?.at(-1)?.text||'',r.time,r.profile,()=>{if(r.locked)return;openChat(r,true)}));let m=$('messageList');m.replaceChildren();STORY.conversations.forEach(r=>makeRow(m,r.name,r.messages?.at(-1)?.text,r.time,null,()=>openChat(r,false)));let c=$('callList');c.replaceChildren();STORY.calls.forEach(x=>makeRow(c,x.name,x.type+' · '+(x.detail||''),x.time,null,null));let g=$('googleList');g.replaceChildren();STORY.googleSearches.forEach(x=>g.append(el('div','search-item','⌕　'+x.query)))}
function openChat(room,isKakao){let parent=$(isKakao?'kchatBody':'imchatBody');parent.replaceChildren();$(isKakao?'kchatName':'imchatName').textContent=room.name;let last='';for(const msg of room.messages||[]){const date=(msg.date||'').replace(/\s+/g,' ').trim();if(date && date!==last){parent.append(el('div','datepill',date+' ›'));last=date}let mine=msg.from==='me',row=el('div','bubbleline '+(mine?'me':'them'));if(!mine&&isKakao)row.append(imgAvatar(room.profile,room.name,'chat-avatar'));let b=el('div','bubblebox');if(!mine&&isKakao)b.append(el('span','sender',room.name));b.append(el('div','bubble',msg.text||''));let time=el('span','btime',msg.time||'');if(mine)row.append(time,b);else row.append(b,time);parent.append(row)}openView(isKakao?'kchat':'imchat');requestAnimationFrame(()=>{parent.scrollTop=parent.scrollHeight})}
function renderNotes(){let box=$('notesList');box.replaceChildren();let groups=[...new Set(STORY.notes.map(n=>n.group||'메모'))];for(let group of groups){box.append(el('div','note-group',group));let card=el('div','notes-card');STORY.notes.forEach((n,i)=>{if((n.group||'메모')!==group)return;let b=el('button','note-entry');b.append(el('strong','',n.title),el('small','',(n.body||'').replace(/\s+/g,' ').slice(0,70)));b.onclick=()=>{ $('noteTitle').textContent=n.title||'';$('noteBody').textContent=n.body||'';$('noteDate').textContent=n.date||'';openView('noteDetail')};card.append(b)});box.append(card)}}
function account(){return STORY.instagram[secret?'secret':'main']}
function renderInstagram(){let a=account();$('igUsername').textContent=a.username;$('igAvatar').src=a.profile;$('igPosts').textContent=a.posts.length;$('igFollowers').textContent=a.followers;$('igFollowing').textContent=a.following;$('igDisplay').textContent=a.display||'';$('igBio').textContent=Array.isArray(a.bio)?a.bio.join('\n'):(a.bio||'');let grid=$('igGrid');grid.replaceChildren();a.posts.forEach((p,i)=>{let b=el('button'),img=el('img');img.src=p.image||(p.images?.[0]||'');img.alt='게시물';b.append(img);if(p.images?.length>1)b.append(el('span','multiple','▣'));b.onclick=()=>openPost(i);grid.append(b)})}
function media(){const images=currentPost.images?.length?currentPost.images:[currentPost.image];mediaIndex=Math.min(images.length-1,Math.max(0,mediaIndex));$('postImage').src=images[mediaIndex];$('mediaCount').textContent=`${mediaIndex+1}/${images.length}`;$('mediaCount').hidden=images.length<2;$('mediaPrev').hidden=mediaIndex===0;$('mediaNext').hidden=mediaIndex>=images.length-1;let dots=$('postDots');dots.replaceChildren();if(images.length>1)images.forEach((x,i)=>dots.append(el('i',i===mediaIndex?'on':'')))}
function openPost(i){let a=account();currentPost=a.posts[i];mediaIndex=0;liked=false;saved=false;const mainSocial='renebaebae님 외 여러명이 좋아합니다';$('postHeading').textContent=a.username;$('postAvatar').src=a.profile;$('postName').textContent=a.username;$('postMusic').textContent=currentPost.music||'♫ Original audio';$('likeCount').textContent=secret?'6':(currentPost.likes||'16.4만');$('commentCount').textContent=secret?'0':(currentPost.comments||'458');$('shareCount').textContent=secret?'0':(currentPost.shares||'3,068');$('postSocial').textContent=secret?(currentPost.social||''):(currentPost.social||mainSocial);$('postCaption').textContent=a.username+' '+(currentPost.caption||'');$('postDate').textContent=currentPost.date||'';$('likeBtn').textContent='♡';$('likeBtn').style.color='#111';$('saveBtn').textContent='♧';media();openView('igpost');$('postScroll').scrollTop=0}
$('mediaPrev').onclick=()=>{mediaIndex--;media()};$('mediaNext').onclick=()=>{mediaIndex++;media()};let touch=0;$('postMedia').addEventListener('touchstart',e=>{touch=e.touches[0].clientX},{passive:true});$('postMedia').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-touch;if(Math.abs(d)>45){mediaIndex+=d<0?1:-1;media()}},{passive:true});$('likeBtn').onclick=()=>{liked=!liked;$('likeBtn').textContent=liked?'♥':'♡';$('likeBtn').style.color=liked?'#f33':'#111'};$('saveBtn').onclick=()=>{saved=!saved;$('saveBtn').textContent=saved?'▣':'♧'};
function switchIg(){secret=!secret;renderInstagram();$('igScroll').scrollTop=0}
let tap=0;$('igAvatar').onclick=()=>{let now=Date.now();if(now-tap<600){switchIg();tap=0}else tap=now};$('igSwitch').onclick=switchIg;
let typed='';function updateDots(){let d=$('passcodeDots');d.replaceChildren();for(let i=0;i<6;i++)d.append(el('i',i<typed.length?'filled':''))}function showPasscode(){typed='';updateDots();$('passcodeHelp').textContent='';openView('passcode')}
function addDigit(d){if(current!=='passcode')return;typed+=d;updateDots();if(typed.length===6){if(typed==='910329'){unlocked=true;typed='';openView('home')}else{typed='';updateDots();$('passcodeHelp').textContent='암호가 올바르지 않습니다.'}}}
for(let i=1;i<=9;i++){let b=el('button','key',String(i));b.type='button';b.onclick=()=>addDigit(String(i));$('passcodeKeys').append(b)}let zero=el('button','key','0');zero.style.gridColumn='2';zero.onclick=()=>addDigit('0');$('passcodeKeys').append(zero);
$('lock').onclick=showPasscode;$('passcodeCancel').onclick=()=>openView('lock');$('homebar').onclick=()=>unlocked?openView('home'):showPasscode();document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>openView(b.dataset.go)));document.addEventListener('keydown',e=>{if(current!=='passcode')return;if(/^\d$/.test(e.key))addDigit(e.key);if(e.key==='Backspace'){typed=typed.slice(0,-1);updateDots()}if(e.key==='Escape')openView('lock')});
function updateClock(){let d=new Date(),hh=d.getHours(),mm=String(d.getMinutes()).padStart(2,'0'),wk=['일','월','화','수','목','금','토'];$('statusTime').textContent=`${hh}:${mm}`;$('lockTime').textContent=`${hh}:${mm}`;$('lockDate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${wk[d.getDay()]})`}
$('owner').textContent=STORY.owner+'의 iPhone';$('battery').textContent=STORY.battery;renderLists();renderNotes();renderInstagram();updateDots();updateClock();setInterval(updateClock,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock()});window.addEventListener('pageshow',updateClock);
</script></body></html>
