/* ================= 편집 영역 끝 ================= */
const $=id=>document.getElementById(id);let active='lock',secret=false;
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));active=id;$('wall').style.display=['lock','home'].includes(id)?'block':'none';$('shade').style.display=['lock','home'].includes(id)?'block':'none';$('status').classList.toggle('dark',!['lock','home','kchat'].includes(id));}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function avatar(name,path){const d=node('div','av');if(path){const i=document.createElement('img');i.src=path;i.alt=name;d.append(i)}else d.textContent=String(name||'').slice(0,2);return d}
function listRow(parent,title,preview,time,profile,initial,fn,unread=0){const b=node('button','listrow');b.append(avatar(initial||title,profile));const body=node('div','rowbody');const top=node('div','rowtitle');top.append(node('strong','',title),node('span','small',time||''));body.append(top,node('div','preview',preview||''));if(unread)body.append(node('span','unread',unread));b.append(body);b.onclick=fn;parent.append(b)}
function render(){ $('owner').textContent=STORY.owner+'의 iPhone';$('lockDate').textContent=STORY.lockDate;$('lockTime').textContent=STORY.lockTime;$('statusTime').textContent=STORY.lockTime;$('battery').textContent=STORY.battery;$('wall').style.backgroundImage=`url(${JSON.stringify(STORY.wallpaper)})`;
STORY.calls.forEach(c=>listRow($('calls'),c.name,`${c.type} · ${c.detail}`,c.time,c.profile,c.avatar,()=>{},0));
STORY.conversations.forEach((r,i)=>listRow($('messageList'),r.name,r.messages.at(-1)?.text,r.time,r.profile,r.avatar,()=>chatOpen('im',i),r.unread));
STORY.kakaoRooms.forEach((r,i)=>listRow($('kakaoList'),r.name,r.messages.at(-1)?.text,r.time,r.profile,r.name,()=>chatOpen('k',i),r.unread));
STORY.googleSearches.forEach(g=>{const row=node('div','searchrow','◷　'+g.query);$('searches').append(row)});
STORY.notes.forEach(n=>{const d=node('div','note');d.append(node('strong','',n.title),node('div','small',n.date),node('p','',n.body));$('notelist').append(d)});
STORY.photos.forEach(p=>{const b=node('button');const i=document.createElement('img');i.src=p.path;i.alt=p.caption;b.append(i);b.onclick=()=>{$('photobig').src=p.path;$('photoTitle').textContent=p.caption;$('photodate').textContent=p.date;show('photodetail')};$('photogrid').append(b)});renderIg();}
function chatOpen(kind,index){const k=kind==='k',room=(k?STORY.kakaoRooms:STORY.conversations)[index],container=$(k?'kbody':'imbody');$(k?'ktitle':'imtitle').textContent=room.name;container.replaceChildren();let lastDate='';room.messages.forEach(m=>{if(m.date&&m.date!==lastDate){container.append(node('div','datepill',m.date+(k?' ›':'')));lastDate=m.date}const row=node('div','bubbleline '+(m.from==='me'?'me':'them'));if(m.from!=='me'&&k){const av=node('div','chatav');if(room.profile){const img=document.createElement('img');img.src=room.profile;av.append(img)}row.append(av)}const box=node('div','bubblebox');if(k&&m.from!=='me')box.append(node('div','sender',room.name));box.append(node('div','bubble',m.text));row.append(box,node('span','btime',m.time||''));container.append(row)});show(k?'kchat':'imchat');requestAnimationFrame(()=>container.scrollTop=container.scrollHeight)}
function renderIg(){const a=STORY.instagram[secret?'secret':'main'];$('igusername').textContent=a.username;$('igprofile').src=a.profile;$('igdisplay').textContent=a.display;$('igbio').textContent=a.bio;$('igposts').textContent=a.posts.length;$('igfollowers').textContent=a.followers;$('igfollowing').textContent=a.following;const grid=$('iggrid');grid.replaceChildren();a.posts.forEach(p=>{const btn=document.createElement('button'),img=document.createElement('img');img.src=p.image;img.alt=p.caption||'게시물';btn.append(img);btn.onclick=()=>{$('igpostimg').src=p.image;$('igcaption').textContent=p.caption||'';$('igdate').textContent=p.date||'';show('igpost')};grid.append(btn)})}
$('igprofile').addEventListener('dblclick',()=>{secret=!secret;renderIg()});let lastTap=0;$('igprofile').addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<380){e.preventDefault();secret=!secret;renderIg();lastTap=0}else lastTap=n},{passive:false});
$('lock').onclick=()=>show('home');$('homebar').onclick=()=>show('home');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));render();
